name: 메이플 정보 수집

on:
  schedule:
    # UTC 기준 → 한국시간 08:17, 14:17, 22:17 (정각은 GitHub 혼잡으로 지연되기 쉬워 17분)
    - cron: "17 23,5,13 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행
    inputs:
      notify_test:
        description: "디스코드 테스트 메시지만 보내기 (API 수집 안 함)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["collector/**", "web/**", "tests/**", "config.toml", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 화면 코드 테스트
        run: node --test tests/*.test.mjs

      - name: 수집기 테스트
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: 넥슨 Open API 수집 + 페이지 생성
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # 코드 푸시 때는 API를 쓰지 않고 화면만 다시 만들어 배포 (호출 한도 절약)
        run: python -m collector.main ${{ (github.event_name == 'push' || inputs.notify_test) && '--site-only' || '' }} ${{ inputs.notify_test && '--notify-test' || '' }}

      - name: 수집 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
