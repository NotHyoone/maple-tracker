# 메이플 트래커 설정 파일

[characters]
# 상세 정보(스탯·장비·심볼·헥사 등)를 수집할 캐릭터 이름.
# 비워두면([]) 계정에서 레벨이 높은 순서로 auto_top 명을 자동 선택합니다.
names = ["loss기억", "실피드군주", "SecCharacter"]
auto_top = 3

[roster]
# 계정의 전체 캐릭터 목록(이름·직업·레벨)을 수집해 페이지에 보여줄지 여부.
# 저장소가 공개라면 이 목록으로 부캐들이 한 계정이라는 것이 드러납니다.
enabled = true

[history]
# 스타포스·큐브·메소 잠재능력 재설정 사용 기록 수집 (집계 숫자만 저장)
enabled = true
# 과거 기록을 실행마다 며칠씩 채울지 (개발용 API 키는 하루 호출 수 제한이 있어 나눠서 채웁니다)
backfill_days_per_run = 20

[notify]
# 디스코드 알림. 웹훅 주소는 GitHub Secret 'DISCORD_WEBHOOK_URL'에 등록합니다 (없으면 알림만 건너뜀)
discord = true
# 종료 며칠 전에 알릴지
ending_days = [3, 1]
# 새로 시작한 이벤트도 알릴지
new_events = true
# 알림에 붙일 멘션 (예: "@here"), 비우면 멘션 없음
mention = ""

[site]
title = "메이플 트래커"
url = "https://nothyoone.github.io/maple-tracker/"
