# 메이플 트래커 설정 파일

[characters]
# 상세 정보(스탯·장비·심볼·헥사 등)를 수집할 캐릭터 이름.
# 비워두면([]) 계정에서 레벨이 높은 순서로 auto_top 명을 자동 선택합니다.
names = ["loss기억", "실피드군주", "SecCharacter"]
auto_top = 3

[roster]
# 계정의 전체 캐릭터 목록(이름·직업·레벨)을 수집해 페이지에 보여줄지 여부.
# 저장소가 공개라면 이 목록으로 부캐들이 한 계정이라는 것이 드러납니다.
enabled = true

[site]
title = "메이플 트래커"
