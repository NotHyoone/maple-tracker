name: 메이플 정보 수집

on:
  schedule:
    # UTC 기준 → 한국시간 08:17, 14:17, 22:17 (정각은 GitHub 혼잡으로 지연되기 쉬워 17분)
    - cron: "17 23,5,13 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["collector/**", "config.toml", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 넥슨 Open API 수집 + 페이지 생성
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: python -m collector.main

      - name: 수집 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
